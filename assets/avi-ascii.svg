<svg xmlns="http://www.w3.org/2000/svg" width="516.0" height="520" viewBox="0 0 516.0 520">
<rect width="100%" height="100%" fill="#050a05"/>

        <style>
            .ascii-line {
                font-family: monospace;
                font-size: 8px;
                fill: #39ff72;
                clip-path: inset(0 100% 0 0);
                animation: typing 2s steps(100, end) forwards;
            }

            @keyframes typing {
                from {
                    clip-path: inset(0 100% 0 0);
                }
                to {
                    clip-path: inset(0 0 0 0);
                }
            }
        </style>
        
